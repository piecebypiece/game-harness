name: decision-provider

on:
  pull_request:
    paths:
      - 'packages/decision-provider/**'
      - '.github/workflows/decision-provider.yml'
      - 'scripts/build-decision-provider-artifact.mjs'
      - 'scripts/build-decision-provider-artifact.test.mjs'
  push:
    branches: [master]
    paths:
      - 'packages/decision-provider/**'
      - '.github/workflows/decision-provider.yml'
      - 'scripts/build-decision-provider-artifact.mjs'
      - 'scripts/build-decision-provider-artifact.test.mjs'

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20.11.1, 22]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/decision-provider
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: packages/decision-provider/package-lock.json
      - run: npm ci --workspaces=false
      - run: npm run typecheck --workspaces=false
      - run: npm test --workspaces=false
      - run: npm pack . --dry-run --ignore-scripts --workspaces=false
      - run: npm run test:decision-provider-artifact
        working-directory: .
